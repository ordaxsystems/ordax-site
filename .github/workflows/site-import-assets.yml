name: Site — import pinned binary source assets (one-time)
on:
  push:
    branches: [feat/site-independent-extraction]
    paths:
      - .github/workflows/site-import-assets.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ordaxsystems/ordax-site' && github.ref == 'refs/heads/feat/site-independent-extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Read pinned canonical source
        uses: actions/checkout@v4
        with:
          repository: ordaxsystems/ordax-os
          ref: 70b0f7eb5d5085be0d4f176f5232def37c7a2a24
          path: _ordax_source_once
          persist-credentials: false
      - name: Transfer only verified immutable PNG blobs
        shell: bash
        run: |
          set -euo pipefail
          for row in \
            'aurora-titanium.png e4574877f57a66574d001ebcfbfc8718782a2c23' \
            'download-hero.png 7c23ed6070890d81a11474108f0a52a0965ce501'; do
            read -r name sha <<< "$row"
            source="_ordax_source_once/sites/public/assets/$name"
            destination="site/assets/$name"
            test -f "$source"
            test "$(git hash-object "$source")" = "$sha"
            if test -e "$destination"; then
              test "$(git hash-object "$destination")" = "$sha"
            else
              install -m 0644 "$source" "$destination"
            fi
            test "$(git hash-object "$destination")" = "$sha"
          done
      - name: Commit exact original files to extraction branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- site/assets/aurora-titanium.png site/assets/download-hero.png
          if git diff --cached --quiet; then
            echo 'Both exact source assets already exist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(site): preserve two pinned original visual assets"
          git push origin HEAD:refs/heads/feat/site-independent-extraction

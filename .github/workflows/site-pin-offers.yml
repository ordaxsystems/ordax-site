name: Site — pin public reference offers (one-time)
on:
  push:
    branches: [feat/site-independent-extraction]
    paths: [.github/workflows/site-pin-offers.yml]
permissions:
  contents: write
jobs:
  snapshot:
    if: github.repository == 'ordaxsystems/ordax-site' && github.ref == 'refs/heads/feat/site-independent-extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ordaxsystems/ordax-os
          ref: 70b0f7eb5d5085be0d4f176f5232def37c7a2a24
          path: _ordax_source_once
          persist-credentials: false
      - name: Project public offers from canonical OS authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json
          from pathlib import Path
          source=Path('_ordax_source_once')
          destination=Path('artifacts/offers/os-migration-70b0f7eb')
          destination.mkdir(parents=True,exist_ok=True)
          file=source/'tools/public-site/plan_catalog.py'
          spec=importlib.util.spec_from_file_location('_ordax_original_public_offers',file)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          catalog=module.load_catalog()
          text=module.render_catalog(catalog)
          assert catalog['purchasable_paid_plans_enabled'] is False
          assert catalog['commercial_capacity_allocation_enabled'] is False
          assert 'contratação indisponível' in text
          assert 'Planos em preparação' in text
          assert '<script' not in text and '<form' not in text and '<a ' not in text
          html=destination/'reference-offers.html'
          html.write_text(text,encoding='utf-8')
          values=html.read_bytes()
          contract=source/'docs/contracts/entitlements.json'
          manifest={
            'artifact_class':'ordax-public-reference-offers',
            'source_repository':'ordaxsystems/ordax-os',
            'source_commit':'70b0f7eb5d5085be0d4f176f5232def37c7a2a24',
            'source_contract_path':'docs/contracts/entitlements.json',
            'source_contract_sha256':hashlib.sha256(contract.read_bytes()).hexdigest(),
            'status':'reference-not-purchasable',
            'html_path':'reference-offers.html',
            'html_sha256':hashlib.sha256(values).hexdigest(),
            'html_size':len(values),
            'paid_purchases_enabled':False,
            'commercial_capacity_allocation_enabled':False
          }
          (destination/'manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('OFFERS_REFERENCE_ARTIFACT=PASS')
          PY
      - name: Commit public non-authoritative projection only
        shell: bash
        run: |
          set -euo pipefail
          git add -- artifacts/offers/os-migration-70b0f7eb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(site): pin read-only commercial reference projection'
          git push origin HEAD:refs/heads/feat/site-independent-extraction

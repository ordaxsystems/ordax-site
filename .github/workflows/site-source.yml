name: Site Candidate — isolated
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: site-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs are synthetic. Candidate receipts must identify the
          # exact real Git commit compiled, not an ephemeral merge revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compile Python tools
        run: python3 -m compileall -q scripts tests
      - name: Audit independent presentation and assets
        run: python3 scripts/build.py check
      - name: Localization parity and accessible copy
        run: node tests/test_localization.mjs
      - name: Verify live legal-document integrity contracts
        run: node tests/test_legal_documents.mjs
      - name: Fail-closed architecture and catalog tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify Vercel gateway host against immutable OS source (staging only)
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          python3 scripts/stage_canonical_gateway.py --out .gateway-source
          node --check api/account-proxy.mjs
          node --test tests/test_gateway_host.mjs
      - name: Verify owner-signed brand and Meridian releases on every CI build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for component in brand surface_preview; do
            mapfile -t pin < <(COMPONENT="$component" python3 - <<'PY'
          import json,os
          item=json.load(open('contracts/dev-artifact-lock.json'))['artifacts'][os.environ['COMPONENT']]['release']
          for key in ('release_tag','source_commit','archive_sha256'):
              print(item[key])
          PY
            )
            if [ "$component" = "brand" ]; then
              archive="ordax-brand-${pin[1]}.tar.gz"
              signer=".github/workflows/public-brand-candidate.yml"
            else
              archive="meridian-dev-${pin[1]}.tar.gz"
              signer=".github/workflows/validate-source-integration.yml"
            fi
            mkdir -p "$RUNNER_TEMP/surface-$component"
            gh release download "${pin[0]}" --repo ordaxsystems/ordax-surface \
              --pattern "$archive" --dir "$RUNNER_TEMP/surface-$component"
            file="$RUNNER_TEMP/surface-$component/$archive"
            echo "${pin[2]}  $file" | sha256sum --check --status
            gh attestation verify "$file" \
              --repo ordaxsystems/ordax-surface \
              --signer-workflow "ordaxsystems/ordax-surface/$signer" \
              --source-ref refs/heads/main --source-digest "${pin[1]}" \
              --deny-self-hosted-runners
          done
          echo "SITE_DEV_SURFACE_RELEASE_SIGNATURES=VERIFIED"
      - name: Build standalone static candidate
        run: |
          python3 scripts/build.py build \
            --source-commit "$(git rev-parse HEAD)" \
            --dev-lock contracts/dev-artifact-lock.json \
            --public-origin https://ordax.com.br \
            --out out/site
          python3 scripts/build.py verify --out out/site
          test "$(python3 -c 'import json; print(json.load(open("out/site/public-site-manifest.json"))["source_commit"])')" = "$(git rev-parse HEAD)"
          echo "SITE_CANDIDATE_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "SITE_CANDIDATE_MANIFEST_SHA256=$(sha256sum out/site/public-site-manifest.json | cut -d ' ' -f1)"
      - name: Verify all built routes and fail-closed default states
        run: python3 scripts/smoke_static.py --out out/site
      - name: Browser proof on Chrome (local-only, offline APIs)
        run: python3 scripts/browser_smoke.py --out out/site --evidence out/browser-evidence
      - name: Upload browser evidence including any failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordax-site-browser-evidence
          path: out/browser-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload non-production candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordax-site-candidate
          path: out/site/
          if-no-files-found: error
          retention-days: 7
      - name: Assert no production deployment
        run: |
          test ! -e .vercel/project.json
          test ! -e .env.production
          echo "SITE_PRODUCTION_DEPLOYMENT=DISABLED"
